name: asmr-workspace-metadata

on:
  push:
    paths:
      - "asmr/**"
      - ".github/workflows/asmr-workspace.yml"
  pull_request:
    paths:
      - "asmr/**"
      - ".github/workflows/asmr-workspace.yml"

jobs:
  package-catalog:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11","3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ./asmr pytest
      - run: python -m pytest -q asmr/tests/test_catalog.py
      - run: python -c "from morphoacoustics_asmr import list_research;assert len(list_research())==5"

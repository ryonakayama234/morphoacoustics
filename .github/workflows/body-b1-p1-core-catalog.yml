name: body-b1-p1-core-closed-catalog
on:
  pull_request:
    paths:
      - "contracts/body/od2-b1/**"
      - "tools/od2_b1_catalog.py"
      - "tests/test_od2_b1_catalog.py"
      - ".github/workflows/body-b1-p1-core-catalog.yml"
      - "docs/product/body-b1/**"
      - "tools/od2_body_cli.py"
      - "src/morphoacoustics/integration/body_presets.py"
  workflow_dispatch:

jobs:
  exact-head-p1-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # The tested revision is the actual proposed PR head, not the synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audited OD-2 numerical environment
        run: |
          python -m pip install "numpy==2.4.6"
          python -m pip install -e ".[dev]"
      - name: Show exact candidate head and source cleanliness
        run: |
          git rev-parse HEAD
          git status --porcelain
          test -z "$(git status --porcelain)"
          python -c "import numpy; assert numpy.__version__ == '2.4.6'"
          mkdir -p "$RUNNER_TEMP/body-b1-p1-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/body-b1-p1-evidence/core-head.txt"
      - name: Core closed catalog and negative/restart suite
        run: |
          python -m pytest -v tests/test_od2_b1_catalog.py
          python tools/od2_b1_catalog.py catalog > "$RUNNER_TEMP/body-b1-p1-evidence/catalog-resolved.json"
          python tools/od2_b1_catalog.py issue --center 4 --ratio 1.10 --output "$RUNNER_TEMP/body-b1-p1-evidence/revision-c4-r110.json"
          python tools/od2_b1_catalog.py resolve --receipt "$RUNNER_TEMP/body-b1-p1-evidence/revision-c4-r110.json" --revision-id od2-7c2663189d907111665544c67def56c885576f5394e4220ec12251e0ca5ebf67 > "$RUNNER_TEMP/body-b1-p1-evidence/readback-c4-r110.json"
          python tools/od2_b1_catalog.py issue --center 8 --ratio 1.00 --output "$RUNNER_TEMP/body-b1-p1-evidence/alias-c8-r100.json"
          python tools/od2_b1_catalog.py resolve --receipt "$RUNNER_TEMP/body-b1-p1-evidence/alias-c8-r100.json" --revision-id v3b-axial-M0@1 > "$RUNNER_TEMP/body-b1-p1-evidence/readback-alias.json"
      - name: Exact-head Core G0 OD-1 OD-2 CC-A2 and whole-repo regression
        run: |
          python -m pytest -q tests/test_od1_local_shape.py tests/test_od2_body_cli.py tests/test_body_presets.py tests/test_cc_a2_live.py
          python -m pytest -q
      - name: Inherited real physical replay and adversarial OD-2 checks
        env:
          OD2_REAL_PHYSICS: "1"
          CC_A2_REAL_PHYSICS: "1"
        run: |
          python -m pytest -v tests/test_od2_body_cli.py tests/test_cc_a2_live.py
          python tools/od2_body_cli.py perform-suite --output-dir "$RUNNER_TEMP/od2-b1-research-physics"
          python tools/od2_b1_catalog.py verify-archive --archive "$RUNNER_TEMP/od2-b1-research-physics" > "$RUNNER_TEMP/body-b1-p1-evidence/physical-archive-verification.json"
      - name: Capture source/pin and protocol receipts
        if: always()
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/body-b1-p1-evidence/core-head-at-end.txt"
          git status --porcelain > "$RUNNER_TEMP/body-b1-p1-evidence/git-status-at-end.txt"
          python --version > "$RUNNER_TEMP/body-b1-p1-evidence/python-version.txt" 2>&1
          python -c 'import numpy; print(numpy.__version__)' > "$RUNNER_TEMP/body-b1-p1-evidence/numpy-version.txt"
      - name: Publish Core-only P1 protocol evidence, never a Studio Take
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body-b1-p1-core-catalog-candidate
          path: ${{ runner.temp }}/body-b1-p1-evidence/
          if-no-files-found: warn

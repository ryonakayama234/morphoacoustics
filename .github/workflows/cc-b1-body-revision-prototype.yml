name: cc-b1-body-revision-prototype
on:
  push:
    paths:
      - "src/morphoacoustics/preparation/cc_b1_revision.py"
      - "tests/test_cc_b1_revision.py"
      - "docs/research/cc-b1-body-revision-prototype/**"
      - ".github/workflows/cc-b1-body-revision-prototype.yml"
  pull_request:
    paths:
      - "src/morphoacoustics/preparation/cc_b1_revision.py"
      - "tests/test_cc_b1_revision.py"
      - "docs/research/cc-b1-body-revision-prototype/**"
      - ".github/workflows/cc-b1-body-revision-prototype.yml"
  workflow_dispatch:

jobs:
  bounded-preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Exact prototype + adopted body binding regression
        run: python -m pytest -v tests/test_cc_b1_revision.py tests/test_preparation.py tests/test_body_presets.py
      - name: Type check
        run: python -m mypy src/morphoacoustics/preparation/cc_b1_revision.py

name: cc-b1-gate-c-versioned-limited-performer
on:
  pull_request:
    paths:
      - "tools/cc_b1_limited_performer.py"
      - "tests/test_cc_b1_limited_performer.py"
      - "contracts/cc-b1/**"
      - "docs/research/cc-b1-body-revision-prototype/**"
      - ".github/workflows/cc-b1-gate-c-versioned-performer.yml"
  workflow_dispatch:
jobs:
  performer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned physical dependencies
        run: |
          python -m pip install "numpy==2.4.6"
          python -m pip install -e ".[dev]"
      - name: Boundary refusals and two true fresh physics pairs
        env:
          CC_B1_GATE_C_PHYSICAL: "1"
        run: python -m pytest -v tests/test_cc_b1_limited_performer.py
      - name: Regression against adopted CC-A2
        env:
          CC_A2_REAL_PHYSICS: "1"
        run: python -m pytest -q tests/test_cc_a2_live.py
      - name: Candidate BodyRevision existing tests
        run: python -m pytest -v tests/test_cc_b1_revision.py tests/test_body_presets.py

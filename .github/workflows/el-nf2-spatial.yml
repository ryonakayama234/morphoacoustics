name: EL-NF2 Research measured spatial receiver

on:
  push:
    branches:
      - research/asmr-el-nf2-spatial-generalization
  pull_request:
    paths:
      - "experiments/046_el_nf2_spatial/**"
      - "tests/test_experiment_046*"
      - "docs/research/listener-nf2/**"
      - ".github/workflows/el-nf2-spatial.yml"
  workflow_dispatch:

jobs:
  static-and-measured:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated research requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' 'scipy>=1.11' 'h5py>=3.8'
      - name: Synthetic and evidence-tamper tests
        run: |
          python -m pytest -q tests/test_experiment_046_el_nf2.py tests/test_experiment_046_audit.py
      - name: Download original published measured SOFA with checksum
        run: |
          mkdir -p /tmp/el-nf2 "$RUNNER_TEMP/el-nf2"
          curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 25 --max-time 240 \
            'https://zenodo.org/records/7316545/files/NF_LIB_HRTF_measured.sofa?download=1' \
            --output /tmp/el-nf2/NF_LIB_HRTF_measured.sofa
          printf '%s  %s\n' '4ba9cc348801a6805265c7168b5b3227' /tmp/el-nf2/NF_LIB_HRTF_measured.sofa | md5sum --check -
          sha256sum /tmp/el-nf2/NF_LIB_HRTF_measured.sofa
      - name: Evaluate frozen final direction and joint spatial holdout
        run: |
          python experiments/046_el_nf2_spatial/run.py \
            --sofa /tmp/el-nf2/NF_LIB_HRTF_measured.sofa \
            --output "$RUNNER_TEMP/el-nf2/evidence.json"
      - name: Reconstruct evidence and validate refusal/holdout arithmetic
        run: |
          python experiments/046_el_nf2_spatial/audit.py \
            --evidence "$RUNNER_TEMP/el-nf2/evidence.json"
      - name: Archive immutable research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: el-nf2-measured-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/el-nf2/evidence.json
          retention-days: 30
          if-no-files-found: ignore

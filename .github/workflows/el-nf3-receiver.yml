name: EL-NF3 research synthetic and strict refusal
on:
  pull_request:
    paths:
      - 'experiments/047_el_nf3_receiver/**'
      - 'tests/test_experiment_047_el_nf3.py'
      - 'tests/test_experiment_047_audit.py'
      - '.github/workflows/el-nf3-receiver.yml'
      - 'docs/research/listener-nf3/**'
  workflow_dispatch:
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated research test dependencies
        run: python -m pip install numpy scipy h5py pytest
      - name: Synthetic geometry and metrology tests (NOT G3)
        run: python -m pytest -q tests/test_experiment_047_el_nf3.py tests/test_experiment_047_audit.py
      - name: Non-adoption guard
        run: |
          test ! -e asmr/src/morphoacoustics_asmr/receiver.py
          echo "Research-only test success is not a measured/scientific result."

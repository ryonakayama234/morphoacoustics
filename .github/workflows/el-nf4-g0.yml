name: EL-NF4 G0 geometry-only SCUT audit
on:
  workflow_dispatch:
  push:
    branches:
      - research/asmr-el-nf4-support-field
    paths:
      - experiments/048_el_nf4_receiver/g0_geometry.py
      - .github/workflows/el-nf4-g0.yml

jobs:
  geometry-no-acoustics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3' 'h5py>=3.8,<4'
      - name: Obtain two independent original public SOFA headers (not redistributing data)
        run: |
          mkdir -p /tmp/nf4
          for n in 0001 0009; do
            curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 25 --max-time 480 \
              "https://sofacoustics.org/data/database/scut/SCUT_NF_subject${n}_measured.sofa" \
              --output "/tmp/nf4/SCUT_NF_subject${n}_measured.sofa"
          done
      - name: Inspect only SourcePosition and metadata, NOT Data.IR array
        run: |
          python experiments/048_el_nf4_receiver/g0_geometry.py /tmp/nf4/*.sofa | tee /tmp/nf4/geometry_manifest.json
      - name: Preserve metadata-only geometry manifest
        uses: actions/upload-artifact@v4
        with:
          name: el-nf4-g0-geometry-only
          path: /tmp/nf4/geometry_manifest.json
          retention-days: 30

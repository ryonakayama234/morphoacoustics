name: EL-NF4 original measured SCUT blind holdout
on:
  push:
    branches: [research/asmr-el-nf4-support-field]
    paths:
      - .github/workflows/el-nf4-measured.yml
      - experiments/048_el_nf4_receiver/run.py
      - experiments/048_el_nf4_receiver/audit.py
  workflow_dispatch:
permissions:
  contents: read

jobs:
  original-measured-relative:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated research tools
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.11,<2' 'h5py>=3.8,<4' 'pytest>=8,<10'
      - name: Run numerical regression before original measurements
        run: python -m pytest -q tests/test_experiment_048_el_nf4.py tests/test_experiment_048_el_nf4_runner.py
      - name: Obtain original publisher-hosted noncommercial SCUT data, ephemeral runner only
        run: |
          set -euo pipefail
          mkdir -p /tmp/nf4-original /tmp/nf4-results
          for i in $(seq 1 10); do
            n=$(printf '%04d' "$i")
            curl --fail --location --retry 5 --retry-delay 5 --connect-timeout 25 --max-time 600 \
              "https://sofacoustics.org/data/database/scut/SCUT_NF_subject${n}_measured.sofa" \
              --output "/tmp/nf4-original/SCUT_NF_subject${n}_measured.sofa"
          done
      - name: Fit only training IR, seal holdout predictions before reading truth
        run: |
          set -euo pipefail
          python experiments/048_el_nf4_receiver/run.py \
             --input-dir /tmp/nf4-original --output /tmp/nf4-results/evidence.json \
             | tee /tmp/nf4-results/science-summary.log
      - name: Independently recompute evidence arithmetic (not human peer review)
        run: |
          set -euo pipefail
          python experiments/048_el_nf4_receiver/audit.py --evidence /tmp/nf4-results/evidence.json \
            | tee /tmp/nf4-results/arithmetic-audit.log
      - name: Upload only non-reconstructive diagnostic numeric evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: el-nf4-measured-numeric-evidence
          path: |
            /tmp/nf4-results/evidence.json
            /tmp/nf4-results/science-summary.log
            /tmp/nf4-results/arithmetic-audit.log
            /tmp/nf4-results/pretruth_seals/*.json
          retention-days: 30
          if-no-files-found: warn

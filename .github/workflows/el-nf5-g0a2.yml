name: EL-NF5 G0-A2 metadata-only original integrity
on:
  push:
    branches:
      - research/asmr-el-nf5-g0a2-original-qualification
    paths:
      - 'experiments/051_el_nf5_g0a2/**'
      - '.github/workflows/el-nf5-g0a2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded audit dependencies
        run: python -m pip install 'h5py>=3.8,<4' 'numpy>=1.24,<3' 'pytest>=8,<10'
      - name: Synthetic non-leak and malformed-data controls
        run: python -m pytest -q experiments/051_el_nf5_g0a2/test_audit.py
      - name: Download publisher original to ephemeral runner (NO artifacts)
        run: |
          set -euo pipefail
          mkdir -p /tmp/nf5-original
          curl --fail --show-error --silent --location --retry 3 --retry-delay 4 --connect-timeout 15 --max-time 180             --output /tmp/nf5-original/NFHRIR_L2702_SOFA.zip             'https://zenodo.org/records/4297951/files/NFHRIR_L2702_SOFA.zip?download=1'
          test "$(stat -c%s /tmp/nf5-original/NFHRIR_L2702_SOFA.zip)" -le 50000000
      - name: Check publisher MD5, original SHA256, and SOFA structural metadata only
        run: |
          set -euo pipefail
          python experiments/051_el_nf5_g0a2/audit.py             --archive /tmp/nf5-original/NFHRIR_L2702_SOFA.zip             --expected-md5 1310d2b015c82272cc27d10d680b6bb4
      - name: Always remove original and ephemeral bytes
        if: always()
        run: rm -rf /tmp/nf5-original

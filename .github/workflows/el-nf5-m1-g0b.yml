name: EL-NF5-M1 sealed geometry only
on:
  push:
    branches: [research/asmr-el-nf5-m1-qualification-20261103]
    paths:
      - '.github/workflows/el-nf5-m1-g0b.yml'
      - 'experiments/052_el_nf5_m1/**'
      - 'docs/research/listener-nf5-m1/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24' 'h5py>=3.8' 'pytest>=8'
      - run: python -m pytest -q experiments/052_el_nf5_m1/test_qualification.py
  original-geometry:
    needs: synthetic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24' 'h5py>=3.8'
      - name: Acquire original archive ephemerally
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 4 --retry-delay 5 --max-time 180 'https://zenodo.org/records/4297951/files/NFHRIR_L2702_SOFA.zip?download=1' --output "${RUNNER_TEMP}/nf5_m1_original.zip"
      - name: G0-B geometry-only audit
        shell: bash
        run: |
          set -euo pipefail
          python experiments/052_el_nf5_m1/qualification.py --archive "${RUNNER_TEMP}/nf5_m1_original.zip" --output "${RUNNER_TEMP}/nf5_m1_g0b_receipt.json"
          test -s "${RUNNER_TEMP}/nf5_m1_g0b_receipt.json"
      - name: Ephemeral cleanup
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/nf5_m1_original.zip" "${RUNNER_TEMP}/nf5_m1_g0b_receipt.json"

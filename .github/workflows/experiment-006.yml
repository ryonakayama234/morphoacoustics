name: experiment-006

on:
  push:
    paths:
      - "experiments/006_gesture_timecourse/**"
      - "src/morphoacoustics/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-006.yml"
  pull_request:
    paths:
      - "experiments/006_gesture_timecourse/**"
      - "src/morphoacoustics/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-006.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Run experiment 006
        run: python experiments/006_gesture_timecourse/run.py > experiment-006.csv
      - name: Show first rows
        run: head -n 12 experiment-006.csv

name: experiment-010

on:
  push:
    paths:
      - "experiments/008_event_trajectory/**"
      - "experiments/009_fixed_tract_waveform/**"
      - "experiments/010_dynamic_gesture_waveform/**"
      - "src/morphoacoustics/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-010.yml"
  pull_request:
    paths:
      - "experiments/008_event_trajectory/**"
      - "experiments/009_fixed_tract_waveform/**"
      - "experiments/010_dynamic_gesture_waveform/**"
      - "src/morphoacoustics/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-010.yml"

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Run Experiment 010
        run: |
          python experiments/010_dynamic_gesture_waveform/run.py \
            --output-dir experiment-010-output
      - name: Show scientific summary
        run: |
          cat experiment-010-output/summary.csv
          cat experiment-010-output/decision.json
      - name: Upload experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: experiment-010-output
          path: experiment-010-output/

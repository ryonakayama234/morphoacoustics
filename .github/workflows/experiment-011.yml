name: experiment-011

on:
  push:
    paths:
      - "experiments/008_event_trajectory/**"
      - "experiments/009_fixed_tract_waveform/**"
      - "experiments/011_gesture_coordination_overlap/**"
      - "src/morphoacoustics/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-011.yml"
  pull_request:
    paths:
      - "experiments/008_event_trajectory/**"
      - "experiments/009_fixed_tract_waveform/**"
      - "experiments/011_gesture_coordination_overlap/**"
      - "src/morphoacoustics/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-011.yml"

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Run Experiment 011
        run: |
          python experiments/011_gesture_coordination_overlap/run.py \
            --output-dir experiment-011-output
      - name: Show scientific summary
        run: |
          cat experiment-011-output/summary.csv
          cat experiment-011-output/decision.json
      - name: Upload experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: experiment-011-output
          path: experiment-011-output/

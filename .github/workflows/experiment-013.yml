name: experiment-013

on:
  push:
    paths:
      - "experiments/008_event_trajectory/**"
      - "experiments/009_fixed_tract_waveform/**"
      - "experiments/011_gesture_coordination_overlap/**"
      - "experiments/012_source_renderer_artifacts/**"
      - "experiments/013_parametric_source_prosody/**"
      - "src/morphoacoustics/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-013.yml"
  pull_request:
    paths:
      - "experiments/008_event_trajectory/**"
      - "experiments/009_fixed_tract_waveform/**"
      - "experiments/011_gesture_coordination_overlap/**"
      - "experiments/012_source_renderer_artifacts/**"
      - "experiments/013_parametric_source_prosody/**"
      - "src/morphoacoustics/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-013.yml"

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Run Experiment 013
        run: |
          python experiments/013_parametric_source_prosody/run.py \
            --output-dir experiment-013-output
      - name: Show scientific summary
        run: |
          cat experiment-013-output/source_metrics.csv
          cat experiment-013-output/fixed_tract_metrics.csv
          cat experiment-013-output/control_metrics.csv
          cat experiment-013-output/coordination_retention.csv
          cat experiment-013-output/decision.json
      - name: Upload experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: experiment-013-output
          path: experiment-013-output/

name: experiment-014

on:
  push:
    paths:
      - "experiments/008_event_trajectory/**"
      - "experiments/009_fixed_tract_waveform/**"
      - "experiments/011_gesture_coordination_overlap/**"
      - "experiments/012_source_renderer_artifacts/**"
      - "experiments/013_parametric_source_prosody/**"
      - "experiments/014_structure_aligned_prosody/**"
      - "src/morphoacoustics/integration/**"
      - "src/morphoacoustics/domain/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-014.yml"
  pull_request:
    paths:
      - "experiments/008_event_trajectory/**"
      - "experiments/009_fixed_tract_waveform/**"
      - "experiments/011_gesture_coordination_overlap/**"
      - "experiments/012_source_renderer_artifacts/**"
      - "experiments/013_parametric_source_prosody/**"
      - "experiments/014_structure_aligned_prosody/**"
      - "src/morphoacoustics/integration/**"
      - "src/morphoacoustics/domain/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-014.yml"

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Run Experiment 014
        run: |
          python experiments/014_structure_aligned_prosody/run.py             --output-dir experiment-014-output
      - name: Show scientific summary
        run: |
          cat experiment-014-output/condition_metrics.csv
          cat experiment-014-output/boundary_pair_metrics.csv
          cat experiment-014-output/decision.json
      - name: Upload primary blind listening set
        uses: actions/upload-artifact@v4
        with:
          name: experiment-014-primary-blind-listening
          path: experiment-014-output/listening/primary_pitch_blind/
      - name: Upload full research outputs
        uses: actions/upload-artifact@v4
        with:
          name: experiment-014-output
          path: experiment-014-output/

name: experiment-015

on:
  push:
    paths:
      - "experiments/015_embodiment_measurement_calibration/**"
      - "src/morphoacoustics/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-015.yml"
  pull_request:
    paths:
      - "experiments/015_embodiment_measurement_calibration/**"
      - "src/morphoacoustics/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-015.yml"

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Run Experiment 015
        run: |
          python experiments/015_embodiment_measurement_calibration/run.py \
            --output-dir experiment-015-output
      - name: Show scientific summary
        run: |
          cat experiment-015-output/sweep.csv
          cat experiment-015-output/sensitivity.csv
          cat experiment-015-output/partition_control.csv
          cat experiment-015-output/effect_vs_numerical.csv
          cat experiment-015-output/decision.json
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: experiment-015-output
          path: experiment-015-output/

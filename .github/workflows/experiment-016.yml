name: experiment-016

on:
  push:
    paths:
      - "experiments/016_same_task_morphology_covariance/**"
      - "src/morphoacoustics/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-016.yml"
  pull_request:
    paths:
      - "experiments/016_same_task_morphology_covariance/**"
      - "src/morphoacoustics/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-016.yml"

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Run Experiment 016
        run: |
          python experiments/016_same_task_morphology_covariance/run.py \
            --output-dir experiment-016-output
      - name: Show scientific summary
        if: always()
        run: |
          test -f experiment-016-output/conditions.csv && cat experiment-016-output/conditions.csv || true
          test -f experiment-016-output/task_residuals.csv && cat experiment-016-output/task_residuals.csv || true
          test -f experiment-016-output/effects.csv && cat experiment-016-output/effects.csv || true
          test -f experiment-016-output/covariance.csv && cat experiment-016-output/covariance.csv || true
          test -f experiment-016-output/decision.json && cat experiment-016-output/decision.json || true
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-016-output
          path: experiment-016-output/
          if-no-files-found: warn

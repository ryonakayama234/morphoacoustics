name: experiment-018

on:
  push:
    paths:
      - "experiments/018_local_area_morphology_sensitivity/**"
      - "src/morphoacoustics/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-018.yml"
  pull_request:
    paths:
      - "experiments/018_local_area_morphology_sensitivity/**"
      - "src/morphoacoustics/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-018.yml"

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Run Experiment 018
        run: |
          python experiments/018_local_area_morphology_sensitivity/run.py \
            --output-dir experiment-018-output
      - name: Show scientific summary
        if: always()
        run: |
          test -f experiment-018-output/conditions.csv && cat experiment-018-output/conditions.csv || true
          test -f experiment-018-output/task_residuals.csv && cat experiment-018-output/task_residuals.csv || true
          test -f experiment-018-output/effects.csv && cat experiment-018-output/effects.csv || true
          test -f experiment-018-output/sensitivity.csv && cat experiment-018-output/sensitivity.csv || true
          test -f experiment-018-output/nonlinearity.csv && cat experiment-018-output/nonlinearity.csv || true
          test -f experiment-018-output/decision.json && cat experiment-018-output/decision.json || true
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-018-output
          path: experiment-018-output/
          if-no-files-found: warn

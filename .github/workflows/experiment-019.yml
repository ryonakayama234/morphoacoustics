name: experiment-019

on:
  push:
    paths:
      - "experiments/019_material_conditioned_realization/**"
      - "src/morphoacoustics/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-019.yml"
  pull_request:
    paths:
      - "experiments/019_material_conditioned_realization/**"
      - "src/morphoacoustics/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-019.yml"

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Run Experiment 019
        run: |
          python experiments/019_material_conditioned_realization/run.py \
            --output-dir experiment-019-output
      - name: Show scientific summary
        if: always()
        run: |
          test -f experiment-019-output/states.csv && cat experiment-019-output/states.csv || true
          test -f experiment-019-output/resonances.csv && cat experiment-019-output/resonances.csv || true
          test -f experiment-019-output/effects.csv && cat experiment-019-output/effects.csv || true
          test -f experiment-019-output/decision.json && cat experiment-019-output/decision.json || true
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-019-output
          path: experiment-019-output/
          if-no-files-found: warn

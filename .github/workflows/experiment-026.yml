name: experiment-026

on:
  push:
    paths:
      - "experiments/009_fixed_tract_waveform/**"
      - "experiments/012_source_renderer_artifacts/**"
      - "experiments/013_parametric_source_prosody/**"
      - "experiments/023_static_vowel_calibration/**"
      - "experiments/026_moving_vowel_transition/**"
      - "src/morphoacoustics/acoustics/**"
      - "src/morphoacoustics/physical/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-026.yml"
  pull_request:
    paths:
      - "experiments/009_fixed_tract_waveform/**"
      - "experiments/012_source_renderer_artifacts/**"
      - "experiments/013_parametric_source_prosody/**"
      - "experiments/023_static_vowel_calibration/**"
      - "experiments/026_moving_vowel_transition/**"
      - "src/morphoacoustics/acoustics/**"
      - "src/morphoacoustics/physical/**"
      - "pyproject.toml"
      - ".github/workflows/experiment-026.yml"

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e .

      - name: Run Experiment 026
        run: |
          python experiments/026_moving_vowel_transition/run.py \
            --output-dir experiment-026-output

      - name: Show scientific summary
        if: always()
        run: |
          if [ -f experiment-026-output/decision.json ]; then
            cat experiment-026-output/decision.json
          fi
          if [ -f experiment-026-output/spatial_diagnostics.csv ]; then
            head -n 12 experiment-026-output/spatial_diagnostics.csv
          fi
          if [ -f experiment-026-output/signal_metrics.csv ]; then
            cat experiment-026-output/signal_metrics.csv
          fi

      - name: Enforce preregistered scientific Gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          decision = json.loads(
              Path("experiment-026-output/decision.json").read_text(encoding="utf-8")
          )
          observed = decision["decision"]
          expected = "SUPPORT_MOVING_ACOUSTICS"
          print(f"Experiment 026 decision: {observed}")
          if observed != expected:
              raise SystemExit(
                  f"preregistered Gate did not pass: expected {expected}, got {observed}"
              )
          PY

      - name: Upload exploratory blind listening set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-026-transition-blind
          path: experiment-026-output/listening/transition_blind/
          if-no-files-found: ignore

      - name: Upload full research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-026-output
          path: experiment-026-output/
          if-no-files-found: warn

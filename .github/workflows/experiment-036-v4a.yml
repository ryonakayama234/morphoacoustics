name: V4-A one-run roundtrip science (research only)
on:
  pull_request:
    paths:
      - 'experiments/036_v4a_one_run_roundtrip/**'
      - '.github/workflows/experiment-036-v4a.yml'
      - 'docs/research/v4a-one-run-roundtrip-prereg-v0.md'
  workflow_dispatch:

jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific environment
        run: |
          python -m pip install 'numpy==2.4.6'
          python -m pip install -e .
      - name: Frozen Wolfram schedule / analytical unit tests
        run: python -m unittest discover -s experiments/036_v4a_one_run_roundtrip -p 'test_*.py' -v
      - name: Run actual physical V4-A (no premade WAV)
        run: python experiments/036_v4a_one_run_roundtrip/run.py --output-dir /tmp/v4a-run1
      - name: Reproducible repeated run and strict numeric gate
        run: |
          python experiments/036_v4a_one_run_roundtrip/run.py --output-dir /tmp/v4a-run2
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/v4a-run1/summary.json').read_text())
          y=json.loads(Path('/tmp/v4a-run2/summary.json').read_text())
          assert x==y, 'same fixture/environment must have identical provenance and hashes'
          assert x['decision']=='SUPPORT_ONE_RUN_ROUNDTRIP'
          assert all(x['checks'].values())
          assert x['metrics']['pressure_sha256']==y['metrics']['pressure_sha256']
          assert x['metrics']['wav_sha256']==y['metrics']['wav_sha256']
          print('PASS: physical 1s roundtrip generated twice with identical source/pressure/WAV')
          PY
      - name: Upload provisional audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4a-036-research-audit
          path: |
            /tmp/v4a-run1/
            /tmp/v4a-run2/
          retention-days: 14

name: VF1B2 rigid scientific reference (research only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "experiments/050_vf1b2_rigid_reference/**"
      - "docs/research/vf1b2-rigid-gateb-20261031/**"
      - ".github/workflows/experiment-050-vf1b2-rigid.yml"
permissions:
  contents: read
jobs:
  scientific-oracle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run frozen scientific tests (retain RED)
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest discover -s experiments/050_vf1b2_rigid_reference -p 'test_*.py' -v 2>&1 | tee test.log
      - name: Generate exact-head raw records
        id: evidence
        continue-on-error: true
        run: |
          python experiments/050_vf1b2_rigid_reference/run.py "${{ runner.temp }}/vf1b2-rigid"
          cp "${{ runner.temp }}/vf1b2-rigid/records.json" ./
          cp "${{ runner.temp }}/vf1b2-rigid/sha256.txt" ./
      - name: Archive evidence even for failed tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vf1b2-rigid-py${{ matrix.python-version }}
          path: |
            test.log
            records.json
            sha256.txt
          if-no-files-found: warn
      - name: Reject failed scientific checks
        if: always()
        run: |
          test "${{ steps.test.outcome }}" = "success"
          test "${{ steps.evidence.outcome }}" = "success"

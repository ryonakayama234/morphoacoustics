name: EL-G0a measured-reception listening gate
on:
  push:
    branches:
      - 'research/listener-g0a-embodied-audition-20261020'
  workflow_dispatch:
jobs:
  test-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent research dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'scipy>=1.11' 'h5py>=3.8' 'soundfile>=0.12'
      - name: Keep original G0 oracle and test new G0a
        run: python -m pytest tests/test_experiment_040_listener_g0.py tests/test_experiment_041_listener_g0a.py -q
      - name: Fetch original Aalto measured SOFA (not vendored)
        run: |
          mkdir -p /tmp/el-g0a-input
          curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 25 --max-time 180 \
            'https://zenodo.org/records/7316545/files/NF_LIB_HRTF_measured.sofa?download=1' \
            --output /tmp/el-g0a-input/NF_LIB_HRTF_measured.sofa
          echo '4ba9cc348801a6805265c7168b5b3227  /tmp/el-g0a-input/NF_LIB_HRTF_measured.sofa' | md5sum --check --status
      - name: Render actual measured-head clips (must fail if SOFA assumptions invalid)
        run: |
          python experiments/041_listener_g0a/run.py \
            --sofa /tmp/el-g0a-input/NF_LIB_HRTF_measured.sofa \
            --output /tmp/el-g0a-listening
          python - <<'PY'
          import json
          from pathlib import Path
          import soundfile as sf
          out=Path('/tmp/el-g0a-listening')
          e=json.loads((out/'evidence.json').read_text())
          assert set(e['cases'])=={'center','right','left'}
          clips=list((out/'audio').glob('*.wav'))
          assert len(clips)==6,clips
          for p in clips:
              info=sf.info(p)
              assert info.samplerate==48000 and info.channels==2
              assert info.subtype=='PCM_24'
          print('VERIFIED 6 real-HRTF stereo WAVs; positions:', [(k,v['azimuth_deg']) for k,v in e['cases'].items()])
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: EL-G0a-measured-HRTF-listening
          path: /tmp/el-g0a-listening/
          retention-days: 30

name: od2-reusable-body-revision-physical-gates
on:
  pull_request:
    paths:
      - "tools/od2_body_cli.py"
      - "tests/test_od2_body_cli.py"
      - "docs/research/od2-reusable-physical-body-20261102/**"
      - ".github/workflows/od2-reusable-body.yml"
      - "experiments/od1_local_shape/**"
      - "src/morphoacoustics/integration/body_presets.py"
  workflow_dispatch:
jobs:
  limited-body-replay-science:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen numerical and development dependencies
        run: |
          python -m pip install "numpy==2.4.6"
          python -m pip install -e ".[dev]"
      - name: Core revision/geometry/negative controls
        run: |
          python -m pytest -v tests/test_od2_body_cli.py tests/test_od1_local_shape.py tests/test_body_presets.py
          python -m pytest -q
      - name: Generate six real source-driven pressure cases and immutable receipts
        run: |
          python tools/od2_body_cli.py inspect
          python tools/od2_body_cli.py derive --center 4 --ratio 1.10
          python tools/od2_body_cli.py perform-suite --output-dir od2-evidence
          python tools/od2_body_cli.py verify --output-dir od2-evidence
          python tools/od2_body_cli.py resolve --output-dir od2-evidence --center 8 --ratio 0.90
          python tools/od2_body_cli.py reperform-revision --output-dir od2-evidence --center 4 --ratio 1.10
          python tools/od2_body_cli.py reperform-revision --output-dir od2-evidence --center 8 --ratio 0.90
      - name: Real physical replay/adversarial process tests
        env:
          OD2_REAL_PHYSICS: "1"
        run: |
          python -m pytest -v tests/test_od2_body_cli.py
      - name: Adopted CC-A2 exact source physical regression
        env:
          CC_A2_REAL_PHYSICS: "1"
        run: python -m pytest -q tests/test_cc_a2_live.py
      - name: Preserve actual raw-Pa and shared-gain WAV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: od2-frozen-model-four-revisions-six-physical-cases
          path: od2-evidence/
          if-no-files-found: warn

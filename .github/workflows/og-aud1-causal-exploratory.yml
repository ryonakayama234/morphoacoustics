name: OG-AUD1 causal six-port exploratory

on:
  pull_request:
    paths:
      - 'experiments/045_og_aud1_causal_monitor/**'
      - '.github/workflows/og-aud1-causal-exploratory.yml'
  workflow_dispatch:

jobs:
  causal-exploratory:
    name: Python ${{ matrix.py }} causal prototype
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Dependencies
        run: python -m pip install numpy
      - name: Six physics and receipt controls
        working-directory: experiments/045_og_aud1_causal_monitor
        run: python -m unittest -v test_causal_monitor.py
      - name: Two fresh source-port A/B runs
        working-directory: experiments/045_og_aud1_causal_monitor
        run: |
          python causal_monitor.py "$RUNNER_TEMP/causal-a" > "$RUNNER_TEMP/receipt-a.json"
          python causal_monitor.py "$RUNNER_TEMP/causal-b" > "$RUNNER_TEMP/receipt-b.json"
          diff "$RUNNER_TEMP/receipt-a.json" "$RUNNER_TEMP/receipt-b.json"
          diff -r "$RUNNER_TEMP/causal-a" "$RUNNER_TEMP/causal-b"

name: og5-gate-b1-numerical-trial

on:
  pull_request:
    paths:
      - "src/morphoacoustics_graph/tree5.py"
      - "src/morphoacoustics_graph/tree5_contract.py"
      - "src/morphoacoustics_graph/__init__.py"
      - "src/morphoacoustics/acoustics/uniform_tube.py"
      - "tests/test_tree5_contract.py"
      - "tests/test_tree5_snapshot_precedence.py"
      - "tests/test_tree5_numeric_trial.py"
      - "checks/check_og5_gate_b3.py"
      - "checks/check_og5_b3_twin.py"
      - "tests/test_og5_evidence_guards.py"
      - "pyproject.toml"
      - "docs/research/og5-*"
      - ".github/workflows/og5-gate-b1-trial.yml"
  push:
    paths:
      - "src/morphoacoustics_graph/tree5.py"
      - "src/morphoacoustics_graph/tree5_contract.py"
      - "src/morphoacoustics_graph/__init__.py"
      - "src/morphoacoustics/acoustics/uniform_tube.py"
      - "tests/test_tree5_contract.py"
      - "tests/test_tree5_snapshot_precedence.py"
      - "tests/test_tree5_numeric_trial.py"
      - "checks/check_og5_gate_b3.py"
      - "checks/check_og5_b3_twin.py"
      - "tests/test_og5_evidence_guards.py"
      - "pyproject.toml"
      - "docs/research/og5-*"
      - ".github/workflows/og5-gate-b1-trial.yml"

jobs:
  b1-internal-physics-only:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Internal numerical candidate vs 144 fixtures and frozen Wolfram 8
        run: python -m pytest -q tests/test_tree5_numeric_trial.py tests/test_tree5_contract.py tests/test_tree5_snapshot_precedence.py
      - name: Type check (non-normative B1 candidate)
        run: python -m mypy src/morphoacoustics_graph/tree5.py src/morphoacoustics_graph/tree5_contract.py


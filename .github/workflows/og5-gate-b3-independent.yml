name: og5-gate-b3-independent-full-state

on:
  pull_request:
    paths:
      - "src/morphoacoustics_graph/tree5.py"
      - "src/morphoacoustics_graph/tree5_contract.py"
      - "checks/check_og5_gate_b3.py"
      - "docs/research/og5-b3-*"
      - "docs/research/og5-gate-b3-*"
      - ".github/workflows/og5-gate-b3-independent.yml"
  push:
    paths:
      - "src/morphoacoustics_graph/tree5.py"
      - "src/morphoacoustics_graph/tree5_contract.py"
      - "checks/check_og5_gate_b3.py"
      - "docs/research/og5-b3-*"
      - "docs/research/og5-gate-b3-*"
      - ".github/workflows/og5-gate-b3-independent.yml"

jobs:
  exact-head-scientific-comparison:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slot: [a, b]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Independent full-port 144-case scorer + eight physical mutants
        env:
          OG5_RUN_SLOT: ${{ matrix.slot }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python checks/check_og5_gate_b3.py --expected-head "$EXPECTED_HEAD" --output-dir "og5-b3-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: og5-b3-${{ matrix.slot }}
          path: og5-b3-evidence/
          retention-days: 90
          if-no-files-found: error

  twin-raw-evidence-audit:
    runs-on: ubuntu-latest
    needs: exact-head-scientific-comparison
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: og5-b3-*
          path: twin
      - name: Compare separate raw trial identities and reject missing evidence
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path("twin")
          a,b=root/"og5-b3-a",root/"og5-b3-b"
          for folder in (a,b):
              for fn in ("case-results.jsonl","mutations.json","summary.json","provenance.json","sha256sums.txt"):
                  assert (folder/fn).is_file(),f"missing {folder}/{fn}"
              sums={}
              for line in (folder/"sha256sums.txt").read_text().splitlines():
                  sha,name=line.split("  ",1)
                  assert hashlib.sha256((folder/name).read_bytes()).hexdigest()==sha
              summary=json.loads((folder/"summary.json").read_text())
              assert summary["positive_success"]==144 and len(summary["eight_mutants"])==8
          for fn in ("case-results.jsonl","mutations.json","summary.json"):
              assert (a/fn).read_bytes()==(b/fn).read_bytes(),f"twin evidence differs: {fn}"
          pa,pb=[json.loads((d/"provenance.json").read_text()) for d in (a,b)]
          assert pa["run_slot"]=="a" and pb["run_slot"]=="b"
          assert pa["git_head"]==pb["git_head"]
          print("TWO RAW EXACT-HEAD ARCHIVES MATCH; scientific trial only, Gate C pending")
          PY

name: og5-gate-b3-independent-full-state

on:
  pull_request:
    paths:
      - "src/morphoacoustics_graph/tree5.py"
      - "src/morphoacoustics_graph/tree5_contract.py"
      - "src/morphoacoustics_graph/__init__.py"
      - "src/morphoacoustics/acoustics/uniform_tube.py"
      - "tests/test_tree5_contract.py"
      - "tests/test_tree5_numeric_trial.py"
      - "checks/check_og5_gate_b3.py"
      - "checks/check_og5_b3_twin.py"
      - "tests/test_og5_evidence_guards.py"
      - "pyproject.toml"
      - "docs/research/og5-contract-goldens.json"
      - "docs/research/og5-b3-*"
      - "docs/research/og5-gate-b3-*"
      - ".github/workflows/og5-gate-b3-independent.yml"
  push:
    paths:
      - "src/morphoacoustics_graph/tree5.py"
      - "src/morphoacoustics_graph/tree5_contract.py"
      - "src/morphoacoustics_graph/__init__.py"
      - "src/morphoacoustics/acoustics/uniform_tube.py"
      - "tests/test_tree5_contract.py"
      - "tests/test_tree5_numeric_trial.py"
      - "checks/check_og5_gate_b3.py"
      - "checks/check_og5_b3_twin.py"
      - "tests/test_og5_evidence_guards.py"
      - "pyproject.toml"
      - "docs/research/og5-contract-goldens.json"
      - "docs/research/og5-b3-*"
      - "docs/research/og5-gate-b3-*"
      - ".github/workflows/og5-gate-b3-independent.yml"

jobs:
  exact-head-scientific-comparison:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slot: [a, b]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Independent full-port 144-case scorer + eight physical mutants
        env:
          OG5_RUN_SLOT: ${{ matrix.slot }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python checks/check_og5_gate_b3.py --expected-head "$EXPECTED_HEAD" --output-dir "og5-b3-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: og5-b3-${{ matrix.slot }}
          path: og5-b3-evidence/
          retention-days: 90
          if-no-files-found: error

  twin-raw-evidence-audit:
    runs-on: ubuntu-latest
    needs: exact-head-scientific-comparison
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: og5-b3-*
          path: twin
      - name: Verify independent raw hashes + compare physical states with frozen tolerances
        run: python checks/check_og5_b3_twin.py twin

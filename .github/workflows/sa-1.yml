name: SA-1 physical source-port audit
on:
  push:
    branches:
      - research/sa-1-**
  pull_request:
    paths:
      - 'experiments/048_source_acoustic_port_audit/**'
      - 'tests/test_experiment_048_sa1.py'
      - '.github/workflows/sa-1.yml'
      - 'docs/research/sa-1/**'
  workflow_dispatch:
jobs:
  source-port-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Frozen source hashes and independent matched-tube oracle
        run: python -m pytest -q tests/test_experiment_048_sa1.py
      - name: Execute unchanged Core M0 acoustic renderer and port audit
        run: python experiments/048_source_acoustic_port_audit/run.py --out "$RUNNER_TEMP/sa-1" > "$RUNNER_TEMP/sa-1-console.json"
      - name: Provenance and non-adoption screen
        if: success()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/sa-1
        run: |
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          p=Path(os.environ["EVIDENCE_DIR"])
          m=json.loads((p/"manifest.json").read_text())
          assert m["adoption"]=="NOT_ADOPTED"
          assert m["status"]=="NUMERIC_DIAGNOSIS_REQUIRES_REVIEW"
          assert m["actual_sa1_head"]=="BIND_VIA_GITHUB_ACTIONS_RUN"
          d=m["diagnostics"]
          assert d["decision"]=="DIAGNOSIS_VERIFIED_REPAIR_REQUIRED"
          assert d["uniform_matched_oracle"]["flow_complex_abs_error"]<1e-10
          assert d["uniform_matched_oracle"]["zin_relative_error"]<1e-10
          assert d["fixed_tract_superposition_relative_error"]<1e-10
          assert d["transfer_identity_max_error"]<1e-10
          for n,prior in {"noise_off":.0005240323048667825,"modal":.8075755574998604,
                          "breathy_gap":.8614920631830499,"pressure_x2":.9364001042145957}.items():
              assert abs(d["jet_p0_original_reproduction"][n]["recomputed"]-prior)<1e-4
          for fn,digest in m["artifact_sha256"].items():
              assert hashlib.sha256((p/fn).read_bytes()).hexdigest()==digest,fn
          (p/"CI_EVIDENCE.txt").write_text("sa1_ci_sha="+os.environ["GITHUB_SHA"]+
              "\nsource_ref="+os.environ["GITHUB_REF"]+
              "\nGate=NUMERIC_DIAGNOSIS_ONLY_NOT_ADOPTED\n",encoding="utf-8")
          print("SA-1 numeric gates passed; no physics or naturalness adoption")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sa-1-acoustic-port-physical-evidence
          path: |
            ${{ runner.temp }}/sa-1
            ${{ runner.temp }}/sa-1-console.json
          retention-days: 30

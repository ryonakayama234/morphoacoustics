name: SA-2A baffled-piston radiation reference
on:
  push:
    branches:
      - research/sa2a-**
  pull_request:
    paths:
      - 'experiments/049_baffled_piston_sa2a/**'
      - 'tests/test_experiment_049_sa2a.py'
      - 'docs/research/sa-2/**'
      - '.github/workflows/sa-2a.yml'
  workflow_dispatch:

jobs:
  baffled-piston-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research-only SciPy without changing Core package dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'scipy>=1.11,<2'
      - name: Independent overlap, hemisphere power, symmetry, M0 port oracles
        run: |
          python -m pytest -q tests/test_experiment_049_sa2a.py
      - name: Frequency-domain reference with genuine fixed M0 body
        run: |
          python experiments/049_baffled_piston_sa2a/run.py --out "$RUNNER_TEMP/sa-2a" > "$RUNNER_TEMP/sa-2a-console.json"
      - name: Validate no-adoption evidence and exact-head CI receipt
        if: success()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/sa-2a
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ["EVIDENCE_DIR"])
          m=json.loads((p/"manifest.json").read_text(encoding="utf8"))
          assert m["adoption"]=="NOT_ADOPTED"
          assert m["result"]=="SA2A_ANALYTIC_REFERENCE_VERIFIED"
          assert m["sa2b"]=="SA2B_TIME_DOMAIN_NOT_RUN"
          assert m["preregistration_sha"]=="38f27596b91c47f7307d34af225f8293afb6268a"
          assert m["gates"]["oracle_max_abs_error"]<=2e-9
          assert m["gates"]["hemisphere_max_relative_power_error"]<=2e-8
          assert m["gates"]["small_ka_R_relative_error"]<1e-3
          assert m["gates"]["small_ka_X_relative_error"]<1e-3
          assert m["gates"]["minimum_R"]>=-1e-12
          assert m["body_frequency_study"]["port_identity_max_rel"]<2e-10
          assert m["body_frequency_study"]["minimum_power_dissipated_w"]>=-1e-12
          assert m["body_frequency_study"]["section_count"]==16
          assert len(m["calibration_radius_study"])==4
          for name,digest in m["artifact_sha256"].items():
            assert hashlib.sha256((p/name).read_bytes()).hexdigest()==digest,name
          (p/"CI_EVIDENCE.txt").write_text(
            "sa2a_exact_github_sha="+os.environ["GITHUB_SHA"]+
            "\nrepo_ref="+os.environ["GITHUB_REF"]+
            "\nGate=SA2A_ANALYTIC_REFERENCE_ONLY_NOT_ADOPTED\n",
            encoding="utf8")
          print("SA-2A analytic frequency-domain gates PASS; no SA-2B/VF-1 adoption")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sa-2a-independent-physics-evidence
          path: |
            ${{ runner.temp }}/sa-2a
            ${{ runner.temp }}/sa-2a-console.json
          retention-days: 30

name: SA-2B B1 Research Duct Gate
on:
  push:
    branches:
      - research/sa2b-b1-duct-20261024
  pull_request:
    paths:
      - 'experiments/051_b1_passive_duct/**'
      - 'tests/test_experiment_051_sa2b_b1.py'
      - 'docs/research/sa-2b-b1/**'
      - '.github/workflows/sa-2b-b1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b1_research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies (research-only SciPy)
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'scipy>=1.11,<2'
      - name: Scientific tests
        run: python -m pytest -q tests/test_experiment_050_sa2b_b0.py tests/test_experiment_051_sa2b_b1.py
      - name: Execute and archive B1 numeric state
        run: |
          python experiments/051_b1_passive_duct/run.py --out "$RUNNER_TEMP/sa2b-b1"
          echo "EXACT_GITHUB_SHA=$GITHUB_SHA" | tee "$RUNNER_TEMP/sa2b-b1/CI_EVIDENCE.txt"
          echo "GITHUB_REF=$GITHUB_REF" | tee -a "$RUNNER_TEMP/sa2b-b1/CI_EVIDENCE.txt"
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID" | tee -a "$RUNNER_TEMP/sa2b-b1/CI_EVIDENCE.txt"
          python - "$RUNNER_TEMP/sa2b-b1" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          d=Path(sys.argv[1])
          m=json.loads((d/'manifest.json').read_text())
          for name,expected in m['sha256'].items():
              actual=hashlib.sha256((d/name).read_bytes()).hexdigest()
              assert actual==expected,(name,actual,expected)
          print("B1 artifact SHA256 local recheck PASS",len(m['sha256']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sa2b-b1-research-port-data
          path: ${{ runner.temp }}/sa2b-b1/
          if-no-files-found: error

name: SMC-2 symbolic research
on:
  pull_request:
    paths:
      - "src/smc2_research/**"
      - "tests/test_smc2_motor_plan.py"
      - "docs/research/speech-motor-compiler/smc2/**"
      - ".github/workflows/smc2-research.yml"
  push:
    branches:
      - "research/smc2-*"
jobs:
  research:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check research types
        run: python -m mypy src/smc2_research
      - name: Symbolic and inherited timing tests
        run: python -m pytest tests/test_smc2_motor_plan.py tests/test_shared_timeline.py -q
      - name: Full Core regressions
        run: python -m pytest -q

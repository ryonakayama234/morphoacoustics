name: sv1-sustained-vowel-physical

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-sv1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # audited v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # audited v5
        with:
          python-version: "3.11"
      - name: Install exact SHA256-verified evidence dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements/sv1-physical-py311.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -c "import numpy; assert numpy.__version__ == '2.4.6'"
          python -m pip check
          python -m pip freeze | sort
      - name: Run SV-1 genuine pressure generation and negative controls
        env:
          SV1_REAL_PHYSICS: "1"
        run: python -m pytest -v tests/test_sv1_sustained_vowel.py
      - name: Recheck adopted CC-A2 physics and no-fallback
        env:
          CC_A2_REAL_PHYSICS: "1"
        run: python -m pytest -v tests/test_cc_a2_live.py
      - name: Generate fresh listenable duration comparison with receipts
        run: |
          python experiments/042_sv1_sustained_vowel/run.py --output-dir sv1-research-output
          python - <<'PY'
          import hashlib, json, pathlib, wave
          root=pathlib.Path("sv1-research-output")
          m=json.loads((root/"manifest.json").read_text())
          for path, claimed_sha in m["artifact_sha256"].items():
              actual=hashlib.sha256((root/path).read_bytes()).hexdigest()
              assert actual==claimed_sha, path
          for role, frames in (("A",12000),("B",24000),("C_concat_DIAGNOSTIC",24000)):
              with wave.open(str(root/(role+"_listen.wav" if role in {"A","B"} else role+".wav"))) as w:
                  assert (w.getnchannels(),w.getsampwidth(),w.getframerate(),w.getnframes())==(1,2,48000,frames)
          assert m["listening_gate"]=="NOT_RUN_CREATOR_LISTENING_PENDING"
          assert m["C"]["is_accepted_physical_take"] is False
          print("SV1 fresh WAVs and independent artifact-byte integrity confirmed")
          PY
      - name: Upload anonymized listening set (listen before opening answer key)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # audited v4
        with:
          name: sv1-blind-listening-trials
          path: sv1-research-output/listening/blind/
          if-no-files-found: error
          retention-days: 90
      - name: Upload complete research receipt and raw acoustic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # audited v4
        with:
          name: sv1-full-research-evidence
          path: sv1-research-output/
          if-no-files-found: error
          retention-days: 90

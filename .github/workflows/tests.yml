name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and honor frozen CC-B1 numerical oracle dependency
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install "numpy==2.4.6"
          python -c "import numpy; assert numpy.__version__ == '2.4.6', numpy.__version__"
      - name: Test
        run: pytest

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Type check
        run: mypy

name: vm1a-broadband-transfer-research

on:
  pull_request:
    paths:
      - tools/vm1_transfer.py
      - tests/test_vm1_transfer.py
      - docs/research/voice-metrology/VM1A_**
      - .github/workflows/vm1a-transfer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vm1a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Reproduce independent matched tube controls, B0 linearity and refusals
        run: python -m pytest -q tests/test_vm1_transfer.py
      - name: Real M0/M1 frozen anatomy, native-clock physical impulse, two boundary conditions
        run: |
          python tools/vm1_transfer.py --out vm1a-report.json
          python - <<'PY'
          import json
          x=json.load(open('vm1a-report.json',encoding='utf-8'))
          assert x['analytic_control']['status']=='MATCHED_UNIFORM_ANALYTIC_PASS'
          assert x['quality_status']=='NOT_ASSESSED'
          assert len(x['runs'])==4
          assert set(x['runs'])=={'M0-b0','M1-b0','M0-matched','M1-matched'}
          for r in x['runs'].values():
              assert r['energy_residual_fraction_max']<=1.0
              assert r['measurement']['df_hz']<3.5
              assert len(r['measurement']['points'])==2
          print('VM1A bounded physical/measurement gates passed; no voice-quality claim')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vm1a-research-transfer-json
          path: vm1a-report.json
          retention-days: 90
          if-no-files-found: error

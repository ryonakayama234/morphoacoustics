name: vm1c-sa2a-b0-radiation-physics-research

on:
  pull_request:
    paths:
      - tools/vm1c_b0_piston_comparison.py
      - tests/test_vm1c_b0_piston_comparison.py
      - .github/workflows/vm1c-b0-piston.yml
      - docs/research/voice-metrology/VM1C_**
      - experiments/049_baffled_piston_sa2a/run.py
      - experiments/028_task_field_morphology_transfer/frozen_reference.json
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ideal-radiation-reference-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Core and canonical SA-2A SciPy analytic reference
        id: install
        run: python -m pip install -e '.[dev]' scipy
      - name: SA-2A oracle, positive radiation loads, algebraic port and negative controls
        run: python -m pytest -q tests/test_vm1c_b0_piston_comparison.py
      - name: Measure actual frozen M0/M1 loaded complex transfer including failures
        if: always() && steps.install.outcome == 'success'
        run: |
          python tools/vm1c_b0_piston_comparison.py --out vm1c-sa2a-vs-b0.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("vm1c-sa2a-vs-b0.json").read_text(encoding="utf-8"))
          assert r["gates_pass"], r["gates"]
          assert r["real_biological_radiation"] == "INDETERMINATE_REAL_RADIATION"
          assert r["voice_quality"] == "VOICE_NO_GO_UNCHANGED"
          assert len(r["M0_M1_loaded_cases"]["M0"]) == 18
          assert len(r["M0_M1_loaded_cases"]["M1"]) == 18
          for row in r["port_selectivity"]:
              print(row["body"], row["law"], row["H600_over_H100_db"], "dB")
          print("VM-1C physical ideal-reference diagnostic only; no causal time model")
          PY
      - name: Always retain numerical research observations and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm1c-piston-vs-b0-m0-m1
          path: vm1c-sa2a-vs-b0.json
          retention-days: 90
          if-no-files-found: warn

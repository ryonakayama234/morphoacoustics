name: wg2-creator-real-physical

on:
  push:
    paths:
      - tools/wg2_creator_take.py
      - tests/test_wg2_creator_take.py
      - docs/research/wg2-creator-source/**
      - .github/workflows/wg2-creator-real.yml
  pull_request:
    paths:
      - tools/wg2_creator_take.py
      - tests/test_wg2_creator_take.py
      - docs/research/wg2-creator-source/**
      - .github/workflows/wg2-creator-real.yml

permissions:
  contents: read

jobs:
  actual-prepared-body-waveguide:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install historical SV1 audit environment (no dependency resolution)
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements/sv1-physical-py311.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Execute two genuine fresh acoustic solver runs against prepared M0/M1
        env:
          WG2_CREATOR_REAL: "1"
        run: python -m pytest -v tests/test_wg2_creator_take.py
      - name: Publish replayable evidence (no false passing marker)
        run: |
          mkdir wg2-evidence
          PYTHONPATH=src python tools/wg2_creator_take.py --body v3b-axial-M0 --revision 1 --character-id ci_creator --duration 0.25 --output-dir wg2-evidence/M0 > wg2-evidence/M0-summary.json
          PYTHONPATH=src python tools/wg2_creator_take.py --body v3b-axial-M1 --revision 1 --character-id ci_creator --duration 0.25 --output-dir wg2-evidence/M1 > wg2-evidence/M1-summary.json
          PYTHONPATH=src python tools/wg2_creator_take.py --verify --output-dir wg2-evidence/M0
          PYTHONPATH=src python tools/wg2_creator_take.py --verify --output-dir wg2-evidence/M1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wg2-prepared-m0-m1-native-physics
          path: wg2-evidence/
          retention-days: 90
          if-no-files-found: error
